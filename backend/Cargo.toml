[package]
name = "backend"
version = "2.0.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
redis = { version = "0.24", features = ["tokio-comp"] }
once_cell = "1.19"
